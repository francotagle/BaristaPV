<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Barista Caffe - Ingreso</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- LOGO BARISTA CAFFE -->
            <img
                src="/imagen/BaristaLogo.png"
                alt="Barista Caffe"
                class="logo-login"
            >

            <p class="login-subtitle">
                Control de inventario
            </p>

            <div class="login-tabs">

                <button
                    type="button"
                    class="login-tab active"
                    data-tab="login"
                >
                    Ingresar
                </button>

                <button
                    type="button"
                    class="login-tab"
                    data-tab="registro"
                >
                    Crear cuenta
                </button>

            </div>

            <form id="login-form">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >

                <button type="submit">
                    Ingresar
                </button>

                <p id="mensaje"></p>

            </form>


            <form id="registro-form" class="form-oculto">

                <label for="registro-email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="registro-email"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="registro-password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="registro-password"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >

                <label for="registro-password2">
                    Repetir contraseña
                </label>

                <input
                    type="password"
                    id="registro-password2"
                    placeholder="••••••••"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Crear cuenta
                </button>

                <p id="registro-mensaje"></p>

                <p class="registro-aviso">
                    Cuando crees tu cuenta, el encargado principal
                    debe asignarte un cargo (cocina, barra o admin)
                    antes de que puedas entrar.
                </p>

            </form>


            <a
                href="index.html"
                style="display:block;margin-top:20px;text-align:center;color:#a3a3a3;font-size:13px;text-decoration:none;"
            >
                &#8249; Elegir otro bar
            </a>


        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- TU JAVASCRIPT -->
    <script src="app.js"></script>

</body>

</html>
