<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Barista Caffe - Ingreso</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- LOGO BARISTA CAFFE -->
            <img
                src="/imagen/BaristaLogo.png"
                alt="Barista Caffe"
                class="logo-login"
            >

            <p class="login-subtitle">
                Control de inventario
            </p>

            <form id="login-form">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >

                <button type="submit">
                    Ingresar
                </button>

                <p id="mensaje"></p>

            </form>

        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- TU JAVASCRIPT -->
    <script src="app.js"></script>

</body>

</html>
