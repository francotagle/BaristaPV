<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Elige tu bar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="portal.css">

</head>

<body class="portal-body">

    <main class="portal">

        <header class="portal-cabecera">

            <p class="portal-lema">
                <span class="portal-linea"></span>
                <span>Dos ambientes</span>
                <span class="portal-punto">&bull;</span>
                <span>Un mismo dueño</span>
                <span class="portal-linea"></span>
            </p>

            <h1 class="portal-titulo">
                Elige tu bar
            </h1>

        </header>


        <a
            href="login-barista.html"
            class="bar bar-barista"
            aria-label="Entrar a Barista Caffè"
        >

            <img
                src="imagen/logo-portal-barista.png"
                alt="Barista Caffè"
                class="bar-logo"
            >

            <span class="bar-boton">
                Entrar a Barista
                <span class="bar-flecha">&rarr;</span>
            </span>

        </a>


        <a
            href="login-babilonia.html"
            class="bar bar-babilonia"
            aria-label="Entrar a Babilonia Bar"
        >

            <img
                src="imagen/logo-portal-babilonia.png"
                alt="Babilonia Bar"
                class="bar-logo"
            >

            <span class="bar-boton">
                Entrar a Babilonia
                <span class="bar-flecha">&rarr;</span>
            </span>

        </a>

    </main>


    <!-- SUPABASE: si ya hay sesión iniciada, pasa directo al dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
